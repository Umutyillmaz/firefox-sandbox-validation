# Hardened, egress-restricted runtime for the Firefox sandbox validation.
# Normally driven by scripts/run_validation.sh, which sets UPSTREAM_DNS and LOGS_DIR.
#
# The browser container has no network namespace of its own. It joins the
# egress sidecar's namespace, whose nftables policy it cannot change (no
# capabilities). Nothing here touches the host firewall or other projects.

name: ffsbx

services:
  egress:
    build:
      context: ./egress
    image: ffsbx-egress:local
    platform: linux/amd64
    network_mode: bridge            # default bridge; no new network is created
    dns:
      - 127.0.0.1                   # resolv.conf -> the filtering dnsmasq (shared with browser)
    environment:
      # Host-specific: the resolver a default-bridge container sees in /etc/resolv.conf.
      # Detected by scripts/run_validation.sh; no default, so a missing value fails loudly.
      UPSTREAM_DNS: "${UPSTREAM_DNS:?set UPSTREAM_DNS (scripts/run_validation.sh detects it)}"
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,size=8m
      - /tmp:rw,nosuid,nodev,noexec,size=8m
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN                   # load nftables rules; dnsmasq --nftset
      - NET_BIND_SERVICE            # dnsmasq on port 53
      - SETUID                      # dnsmasq drops to the dnsmasq user
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "test", "-f", "/run/egress.ready"]
      interval: 1s
      timeout: 2s
      retries: 30

  browser:
    build:
      context: ./browser
      dockerfile: Dockerfile.hardened
    image: ffsbx-browser:local
    platform: linux/amd64
    network_mode: "service:egress"
    depends_on:
      egress:
        condition: service_healthy
    init: true                      # tini as PID 1: reaps orphaned background tasks
    user: "10001:10001"
    read_only: true
    tmpfs:
      # Browser profiles, Xvfb socket, HOME and library state live in RAM and
      # disappear with the container. noexec: nothing is executed from here.
      - /tmp:rw,nosuid,nodev,noexec,size=1536m,mode=1777
    shm_size: "1gb"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true      # default Docker seccomp profile stays in force
    pids_limit: 512
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
      core: { soft: 0, hard: 0 }    # no core dumps with page contents in them
    working_dir: /app
    volumes:
      - ../tests:/app/tests:ro      # code: read-only
      - ${LOGS_DIR:?set LOGS_DIR}:/app/logs:rw # the only writable host path
    environment:
      SMOKE_STRICT_PROCESSES: "1"
